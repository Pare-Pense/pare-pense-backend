services:
    db:
        image: postgres:18-alpine
        restart: always
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_SENHA}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql

volumes:
    pgdata:
